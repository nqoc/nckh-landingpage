<section id="topics" class="section topics-section">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">
        <span class="roman-prefix">II.</span> Kho hướng đề tài tiêu biểu &amp; chuẩn hóa
      </h2>
      <p class="section-desc">
        Mỗi đề tài được xây dựng theo cấu trúc bài báo khoa học chuẩn: xác lập khoảng trống tri thức (Research Gap), 
        phương pháp định lượng / thực nghiệm và có Giảng viên trực tiếp bảo trợ.
      </p>
    </div>

    <!-- Thanh công cụ Lọc danh mục & Tìm kiếm từ khóa (Debounced 200ms) -->
    <div class="search-filter-toolbar">
      <div class="filter-tabs-wrapper" role="tablist" aria-label="Lọc theo lĩnh vực">
        <button class="filter-tab active" data-field="all" role="tab" aria-selected="true">Tất cả đề tài</button>
        <button class="filter-tab" data-field="ai-tech" role="tab" aria-selected="false">AI &amp; Trí tuệ Nhân tạo</button>
        <button class="filter-tab" data-field="engineering" role="tab" aria-selected="false">Kỹ thuật &amp; IoT</button>
        <button class="filter-tab" data-field="economics" role="tab" aria-selected="false">Kinh tế &amp; Khởi nghiệp</button>
        <button class="filter-tab" data-field="green" role="tab" aria-selected="false">Môi trường &amp; Bền vững</button>
      </div>

      <div class="search-input-wrapper">
        <svg class="search-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="topic-search-input" 
          placeholder="Tìm từ khóa: Deep Learning, LoRa, Khảo sát Gen Z..." 
          aria-label="Tìm kiếm đề tài nghiên cứu"
          autocomplete="off"
        >
        <button type="button" id="search-clear-btn" class="search-clear-btn" title="Xóa từ khóa tìm kiếm" aria-label="Xóa từ khóa">
          &times;
        </button>
      </div>
    </div>

    <!-- Phản hồi số lượng tìm kiếm (Hỗ trợ Screen Reader aria-live="polite") -->
    <div id="search-feedback" class="search-feedback" aria-live="polite"></div>

    <!-- Danh sách thẻ đề tài render động qua .map() -->
    <div id="topics-grid" class="topics-grid bento-topics-grid">
      <!-- Dynamic render by courses.js -->
    </div>
  </div>
</section>
