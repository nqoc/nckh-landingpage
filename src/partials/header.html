<header id="site-header" class="site-header">
  <div class="container header-inner">
    <a href="#" class="brand" aria-label="NOVA Research - Trang chủ">
      <div class="brand-badge">N</div>
      <div class="brand-text">
        <div class="brand-row">
          <span class="brand-title">NOVA</span>
          <span class="brand-chip">NCKH 2026</span>
        </div>
        <span class="brand-sub">Cộng đồng NCKH Sinh viên</span>
      </div>
    </a>

    <nav class="nav-links" aria-label="Điều hướng chính">
      <a href="#roadmap" class="nav-item">Lộ trình</a>
      <a href="#topics" class="nav-item">Kho đề tài</a>
      <a href="#about" class="nav-item">Phương pháp</a>
      <a href="#mentors" class="nav-item">Review</a>
      <a href="#faq" class="nav-item">Hỏi đáp</a>
    </nav>

    <div class="header-actions">
      <!-- Nút Đã lưu (Wishlist / Notebook Pill Badge) -->
      <button id="notebook-btn" class="btn-pill-action btn-saved-pill" title="Sổ tay đề tài quan tâm" aria-label="Sổ tay đề tài đã lưu">
        <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Đã lưu</span>
        <span id="notebook-count-badge" class="count-pill">0</span>
      </button>

      <!-- Nút Đổi Theme Sáng / Tối -->
      <button id="theme-toggle" class="btn-pill-action" title="Chuyển chế độ Sáng / Tối" aria-label="Chuyển chế độ sáng tối">
        <svg id="theme-icon-sun" class="icon-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="theme-icon-moon" class="icon-svg" style="display: none;" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span id="theme-label-text">Tối</span>
      </button>

      <!-- Nút Chữ to Trợ năng (Accessibility Font Scaling) -->
      <button id="font-scale-toggle" class="btn-pill-action" title="Phóng to cỡ chữ cho dễ đọc bài báo" aria-label="Phóng to cỡ chữ">
        <span style="font-weight: 800;">T</span>
        <span>Chữ to</span>
      </button>

      <!-- Nút CTA chính -->
      <a href="#consultation" class="btn btn-primary btn-header-cta">
        <span>Đăng ký tư vấn</span>
        <svg viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
          <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
      </a>

      <!-- Nút Hamburger Mobile -->
      <button id="mobile-toggle" class="btn-icon hamburger-btn" aria-label="Mở menu di động">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </div>
</header>
